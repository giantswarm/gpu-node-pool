# The CI oracles, pinned here for Renovate's helmv3 manager to bump.
# cluster-aws, the newest released: `make verify` renders its worker pool with
# hack/oracle/values.yaml and diffs its bootstrap against ours; a bump that
# changes the worker bootstrap fails CI until the chart follows.
# aws-resolver-rules-operator serves the KarpenterMachinePool CRD: the rendered
# KarpenterMachinePool is validated against its schema.
apiVersion: v2
name: oracle
version: 0.0.0
dependencies:
  - name: cluster-aws
    version: 10.3.0
    repository: https://giantswarm.github.io/cluster-catalog
  - name: aws-resolver-rules-operator
    version: 0.27.2
    repository: https://giantswarm.github.io/control-plane-catalog
