# The intentional differences between the pool's bootstrap and cluster-aws's
# worker pool, as `<Kind> <dotted.path>` removed from both renders before the
# diff. Anything else that differs fails `make verify`.
# The pool's identity and the chart's own labels; the KubeadmConfig hash.
- KarpenterMachinePool metadata
- KubeadmConfig metadata
- MachinePool metadata
- MachinePool spec.template.spec.bootstrap.configRef.name
# The pool's own pins.
- MachinePool spec.template.spec.version
- KarpenterMachinePool spec.ec2NodeClass.amiSelectorTerms
# The GPU shape.
- KarpenterMachinePool spec.ec2NodeClass.blockDeviceMappings
- KarpenterMachinePool spec.ec2NodeClass.instanceStorePolicy
- KarpenterMachinePool spec.nodePool.disruption
- KarpenterMachinePool spec.nodePool.limits
- KarpenterMachinePool spec.nodePool.template.spec.requirements
- KarpenterMachinePool spec.nodePool.template.spec.taints
- KubeadmConfig spec.joinConfiguration.nodeRegistration.taints
# The block the KarpenterMachinePool controller overwrites; not carried.
- KarpenterMachinePool spec.ec2NodeClass.kubelet
# The GPU node's driver and container runtime: Flatcar's prebuilt nvidia-drivers
# extension in place of the build at boot (enabled-sysext.conf, nvidia.service
# masked), the CDI specification of the driver and the nvidia runtime in CDI mode
# (nvidia-cdi-spec.service).
- KubeadmConfig spec.files[path=/etc/flatcar/enabled-sysext.conf]
- KubeadmConfig spec.ignition.containerLinuxConfig.additionalConfig.systemd.units[name=nvidia.service]
- KubeadmConfig spec.files[path=/etc/systemd/system/nvidia-cdi-spec.service]
- KubeadmConfig spec.ignition.containerLinuxConfig.additionalConfig.systemd.units[name=nvidia-cdi-spec.service]
# The node's lib volume: /var/lib on the instance store in place of the gp3 volume
# -- the unit formatting it and its script, and no lib filesystem entry (the
# block device mappings are whitelisted above).
- KubeadmConfig spec.files[path=/opt/bin/format-instance-store.sh]
- KubeadmConfig spec.files[path=/etc/systemd/system/format-instance-store.service]
- KubeadmConfig spec.ignition.containerLinuxConfig.additionalConfig.systemd.units[name=format-instance-store.service]
- KubeadmConfig spec.ignition.containerLinuxConfig.additionalConfig.storage.filesystems[name=lib]
