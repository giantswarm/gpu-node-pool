# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates the
# kind cluster and hands ATS its kubeconfig; helm and kubectl come with the
# ATS image.
#
# Smoke, functional and upgrade are skipped: the chart renders Cluster API
# objects (MachinePool, KubeadmConfig, KarpenterMachinePool) whose CRDs the ATS
# kind cluster does not have, so an install cannot succeed there. ATS builds,
# lints and validates the chart's metadata; the render goldens and the
# bootstrap diff against cluster-aws (`make verify`, the Verify workflow) are
# the chart's verification.
skip-steps: [smoke,functional,upgrade]
