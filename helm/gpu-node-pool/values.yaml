# Values of one GPU node pool: a Cluster API release of its own for an existing
# Giant Swarm cluster. `<cluster.name>-<pool.name>` names the MachinePool and,
# through it, the KubeadmConfig (hash-suffixed), the KarpenterMachinePool, the
# Karpenter NodePool and EC2NodeClass and the S3 key of the bootstrap data.
#
# Registry credentials never go into these values inline: cluster-manager hands
# them to the release through a `valuesFrom` Secret, and the chart reads them as
# ordinary values from either source.

cluster:
  # @schema required:true;pattern:^(|[a-z0-9][-a-z0-9]{0,18}[a-z0-9])$
  # -- Name of the existing Cluster API cluster the pool joins.
  name: ""
  # @schema required:true
  # -- Organization owning the cluster; the release lives in `org-<organization>`.
  organization: ""
  # @schema required:true
  # -- Base domain of the installation (the cluster's `global.connectivity.baseDomain`).
  baseDomain: ""
  # @schema required:true
  # -- Name of the management cluster (the cluster's `global.managementCluster`).
  managementCluster: ""
  # -- Registry containerd pulls the sandbox (pause) image from.
  containerRegistry: gsoci.azurecr.io
  # @schema additionalProperties:true
  # -- Registry mirrors as containerd `hosts.toml` files: registry host -> ordered
  # list of endpoint hosts (a snapshot of the cluster's mirrors and local registry cache).
  registryMirrors: {}
  proxy:
    # -- Route containerd, kubelet, teleport and the kubeadm commands through the cluster's HTTP proxy.
    enabled: false
    # -- HTTP proxy URL.
    httpProxy: ""
    # -- HTTPS proxy URL.
    httpsProxy: ""
    # -- Comma-separated no-proxy list as the cluster computes it.
    noProxy: ""
  cilium:
    # @schema enum:[kubernetes,eni]
    # -- Cilium IPAM mode of the cluster; decides the unmanaged-devices network unit.
    ipamMode: kubernetes
  kubelet:
    # -- Maximum pods per node as the cluster's kubelet patch sets it.
    maxPods: 110

pool:
  # @schema required:true;pattern:^(|[a-z0-9][-a-z0-9]{3,18}[a-z0-9])$
  # -- Name of the node pool within the cluster; five to twenty characters.
  name: ""
  # @schema required:true;pattern:^(|[0-9]+\.[0-9]+\.[0-9]+)$
  # -- Kubernetes version the pool's nodes run (`1.33.1`), never newer than the control plane.
  kubernetesVersion: ""
  # @schema required:true
  # -- Name of the Flatcar machine image (`flatcar-<channel>-<flatcar>-kube-<k8s>-tooling-<tooling>-gs`).
  machineImage: ""
  # @schema enum:[nvidia-l4,nvidia-a10g,nvidia-t4,nvidia-l40s]
  # -- Accelerator from the curated list; picks the EC2 instance family.
  accelerator: nvidia-l4
  # @schema item:string;minItems:1
  # -- Instance sizes Karpenter may pick within the accelerator's family, smallest first.
  sizes:
    - xlarge
    - 2xlarge
    - 4xlarge
  # @schema item:string
  # -- Availability zones the pool's nodes launch in (`eu-central-1b`), among the cluster's node
  # subnets; empty for any of them. An installation with a kept model cache pins its pools to the
  # cache's zone: the claim is one EBS volume, and a node in another zone strands the workload mounting it.
  zones: []
  # @schema enum:[0]
  # -- Minimum size; Karpenter scales the pool to zero when nothing is scheduled.
  minSize: 0
  # @schema additionalProperties:true
  # -- Upper bound of the pool, as Karpenter limits (resources across all of its nodes).
  maxSize:
    nvidia.com/gpu: "4"
  # -- Time an empty or underutilized node lives before Karpenter consolidates it.
  consolidateAfter: 10m
  volumes:
    # -- Root volume.
    root: 15Gi
    # @schema enum:[instance-store,ebs]
    # -- Where `/var/lib` lives: the container images, the kubelet's directories and the pods'
    # ephemeral storage. `instance-store`: the node's own NVMe instance store, which every size of
    # the curated families has (125 to 900 GB below `12xlarge`), formatted at first boot and gone
    # with the node; no lib volume is provisioned and Karpenter counts the store as the node's
    # ephemeral storage. `ebs`: a provisioned gp3 volume of `lib`, `libThroughput` and `libIops`.
    libSource: instance-store
    # -- Size of the `/var/lib` volume with `libSource: ebs`.
    lib: 200Gi
    # @schema minimum:125;maximum:1000
    # -- Provisioned throughput of the `/var/lib` volume in MiB/s with `libSource: ebs`; image pulls
    # on a fresh node are bounded by it. gp3 allows 125 to 1000 and at most 0.25 MiB/s per provisioned IOPS.
    libThroughput: 500
    # @schema minimum:3000;maximum:16000
    # -- Provisioned IOPS of the `/var/lib` volume with `libSource: ebs`. gp3 allows 3000 to 16000.
    libIops: 4000
    # -- `/var/log` volume.
    log: 30Gi
  prewarm:
    # -- Launch the pool's first node at install: a one-shot Job holds one GPU at negative
    # priority until the first workload preempts it. Only for the installation's own pool,
    # where the release namespace is on the cluster the nodes join.
    enabled: false
    # @schema minimum:1;maximum:1440
    # -- Minutes the placeholder holds the node when no workload comes; then it ends and
    # Karpenter consolidates the empty node.
    holdMinutes: 15
    # -- Image of the placeholder; anything with `sleep`.
    image: gsoci.azurecr.io/giantswarm/alpine:3.22.1
    # -- Name of the PriorityClass the placeholder runs under: a negative value with
    # `preemptionPolicy: Never`, so the first workload preempts it. The chart renders no
    # PriorityClass (a pool release is namespaced); the agent-platform release ships this one.
    priorityClassName: agent-platform-prewarm-placeholder
  nvidiaDriver:
    # @schema enum:[flatcar-sysext,image-build]
    # -- Where the node's NVIDIA driver comes from. `flatcar-sysext`: the prebuilt, release-matched
    # `flatcar-nvidia-drivers-<branch>` system extension Flatcar ships next to the image (Flatcar 4344.0.0
    # and newer; an older image is refused), fetched and verified by the OS at first boot, so the node
    # registers like any other node. `image-build`: Flatcar's `nvidia.service` builds the driver for the
    # running kernel at each node's first boot, minutes per node.
    source: flatcar-sysext
    # @schema pattern:^[0-9]{3}(-open)?$
    # -- Driver branch of the extension (`535`, `550`, `570`), as Flatcar names it; the proprietary variant.
    branch: "570"
    # -- Directory holding the release's `flatcar-nvidia-drivers-<branch>.raw` for a network the Flatcar
    # release server is not reachable from: Ignition downloads the image from there at first boot and the
    # OS activates it without downloading. Empty: the OS fetches it from Flatcar's release server for its
    # own version.
    baseURL: ""
