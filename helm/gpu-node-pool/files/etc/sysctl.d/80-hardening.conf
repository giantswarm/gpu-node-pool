# Giant Swarm node hardening.
# Sorted after Flatcar's 65-baselayout.conf and before Image Builder's
# 99-sysctl.conf and Cilium's 99-zzz-override_cilium.conf. Keys those files
# set (inotify limits, kubelet protect-kernel-defaults keys, rp_filter) are
# intentionally left to them.

# Hide kernel pointers from all users (Flatcar default: 1).
kernel.kptr_restrict = 2
# Disable magic SysRq (systemd default: 16).
kernel.sysrq = 0

net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

# Some applications, like Elasticsearch, need a higher mmap count limit.
vm.max_map_count = 262144

# Keep ephemeral source ports out of the Kubernetes NodePort range.
net.ipv4.ip_local_reserved_ports = 30000-32767
